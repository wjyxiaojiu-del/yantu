name: tests

on: [push, pull_request]
jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv .venv
      - run: uv pip install -q -r server/requirements.txt pytest "httpx<0.28"
      - run: .venv\Scripts\python -m pytest -q
